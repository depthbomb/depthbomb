name: Update time-of-day banner

on:
  schedule:
    - cron: "7,37 * * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: time-of-day-banner
  cancel-in-progress: true

jobs:
  update:
    if: github.repository == 'depthbomb/depthbomb'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Generate banner
        run: bun scripts/update-time-of-day.mjs

      - name: Commit generated banner
        shell: bash
        run: |
          if git diff --quiet -- README.md assets/time-of-day-phases; then
            echo "The correct phase is already selected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/time-of-day-phases
          git commit -m "chore(profile): update time-of-day banner"
          git push
